# Profile for the big box: AMD EPYC 9754 (128 cores / 256 threads), 512 GB RAM, several RTX 5070 Ti.
# Only the differences from config/train.yaml's values matter here; everything else uses the defaults in
# python/riftzero/config.py — so copy any setting from train.yaml you want to keep the same (decks, caps, ...).
#   scripts/start.sh --config config/train-epyc.yaml

run:
  name: epyc-1
  seed: 1
  runsDir: runs

decks:
  mode: pool
  pool:                 # Jonathon's four lists (same as config/train.yaml). With ~8x the games a wider pool is
    - decks/home-azir.json         # affordable later, e.g. add 03-evelynn.json, 09-irelia.json, 11-kennen.json,
    - decks/home-vex.json          # 12-ezreal.json, 13-sett.json from data/meta-decks/
    - decks/home-rek-sai.json
    - decks/home-mordekaiser.json
  allowMirror: true

caps:
  maxTurns: 60
  maxTurnsAnneal: { to: 40, startStep: 20000, endStep: 60000 }   # same as home-1 (same batch size)
  timeoutShaping: 0.2
  maxActions: 1500
  maxMainPerTurn: 40

selfplay:
  workers: 120          # measured 2026-11-27: 60 → 3.97k evals/s, 120 → 5.14k, 192 → 5.18k, 240 → 5.19k (not the GPU: small model no faster). 120 it is
  concurrentGames: 4
  gamesPerShard: 8

env:
  kind: factored

search:
  algorithm: gumbel
  fullSims: 96
  fastSims: 24
  fullProb: 0.25
  maxConsidered: 16

evalSearch:
  fullSims: 96

inference:
  backend: torch
  host: 127.0.0.1
  basePort: 47000
  gpus: [0]             # simulation-server has one RTX 3060 Ti 8 GB (nvidia-smi -L, 2026-11-27); list every GPU here
  serversPerGpu: 4      # after the engine perf pass, 2 servers (each ~125% CPU, Python-bound) left workers waiting (73% CPU)
  maxBatch: 512
  batchTimeoutMs: 2.0
  dtype: bf16
  reloadEverySec: 20
  memoryFraction: 0.15  # 4 servers + trainer share one 8 GB card

model:
  size: medium          # ≈ 6M params

train:
  gpu: 0                # put the trainer on a GPU of its own if you have one more than `inference.gpus`
  batchSize: 256        # 8 GB card: trainer peak 1.5 GB at 256, 4.4 GB at 512, >6.5 GB at 1024 (OOM beside 2 servers)
  lr: 3.0e-4            # as home-1 (batch 256)
  warmupSteps: 500
  schedule: cosine
  totalSteps: 400000
  minPositions: 50000
  replayPositions: 2000000   # ~60 GB RAM
  maxSampleReuse: 1.5    # was 4. Offline A/B 2026-11-28 (5 fresh nets, 160k epyc-1 positions, scored on unseen games):
                         # held-out value MSE is best at reuse 1.2-1.6 (0.663) and worse past it (0.742 at 3.15).
                         # Weight decay 0.03 made no difference and the small model was no better (CHANGELOG)
  ckptEverySteps: 250    # 250 × 256 ÷ reuse 1.5 ≈ 43k new positions (~16 min) per self-play net
  keepCheckpoints: 100
  keepShardFiles: 8000   # ~8000 × 8 games × ~40 positions × ~33 KB ≈ 85 GB of shards on disk

eval:
  everyCheckpoints: 12  # every 3,000 steps ≈ 512k positions (~3.2 h at reuse 1.5); one eval takes ~1.5 h
  gamesPerOpponent: 40
  opponents: [searchai, best, bot]
  concurrentGames: 8
  gating: { enabled: false, threshold: 0.55 }
